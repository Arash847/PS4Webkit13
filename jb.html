<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 WebKit Jailbreak</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Kept for ?log=1 debug mode only. The card UI above is pixel-identical
     to the reference project; this block only affects body.log. */
  #logwrap { display: none; }
  body.log .card { display: none; }
  body.log { text-align: left; }
  body.log #logwrap { display: block; padding: 14px 18px; }
  body.log #state { display: block; font-size: 22px; font-weight: 700; margin: 0 0 8px; color: #e8ecf4; }
  body.log #out {
    display: block; white-space: pre-wrap;
    font: 12px/1.45 Consolas, monospace;
    background: #11151b; border: 1px solid #1e2732; border-radius: 5px;
    padding: 10px 12px; height: calc(100vh - 141px); overflow-y: auto; color: #c8ced8;
  }
  body.log #out .ok { color: #7fd0a0; }
  body.log #out .bad { color: #d08a7f; }
  body.log #out .warn { color: #d8c07f; }
  #state, #out { display: none; }
</style>
</head>
<body>
<main class="card">
    <img class="logo" src="logo.png" alt="GoldHEN">
    <div class="eyebrow">PS Torghabeh</div>
    <h1 class="title">PS4 WebKit Jailbreak</h1>
    <div class="subtitle">FIRMWARE 13.02 &mdash; 13.52</div>
    <div class="fw-badge" id="fwbadge">GOLDHEN</div>
    <div class="progress-wrap" id="progress-wrap">
        <div class="progress-info">
            <span id="progress-label">Initializing...</span>
            <span id="progress-pct"></span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
    <h1 id="msgs">Loading GoldHEN... Please Wait</h1>
</main>
<div id="logwrap">
  <div id="state"></div>
  <div id="out"></div>
</div>
<script>
/* Card UI bridge (display only -- the exploit chain in jb.js is untouched).
   jb.js signals only via document.body.className ("done"/"fail", or "log"
   for ?log=1), so this mirrors the reference project's fake-until-done
   progress bar: creep to 90% while running, snap to 100% on completion. */
(function () {
    function $(id) { return document.getElementById(id); }

    var ua = navigator.userAgent.match(/PlayStation 4[ \/]([\d.]+)/i);
    if (ua) {
        $("fwbadge").innerHTML = "FW " + ua[1] + " &middot; GOLDHEN";
    }

    // ?log=1 debug mode: jb.js owns #state/#out, hide the card via CSS.
    if (location.search.indexOf("log=1") !== -1) {
        var w = $("progress-wrap");
        if (w) { w.style.display = "none"; }
        return;
    }

    var pct = 0;
    var fill = $("progress-fill");
    var num = $("progress-pct");
    var label = $("progress-label");
    var msgs = $("msgs");
    var stopped = false;

    function render() {
        fill.style.width = pct + "%";
        num.innerHTML = pct + "%";
    }

    var timer = setInterval(function () {
        if (stopped) { clearInterval(timer); return; }
        var cls = document.body ? document.body.className : "";
        if (cls === "done") {
            fill.className = "progress-fill success";
            fill.style.width = "100%";
            num.innerHTML = "100%";
            label.innerHTML = "Done!";
            msgs.innerHTML = "GoldHEN Loaded &#10004;";
            stopped = true;
            clearInterval(timer);
            return;
        }
        if (cls === "fail") {
            fill.className = "progress-fill error";
            fill.style.width = "100%";
            num.innerHTML = "";
            label.innerHTML = "Error";
            msgs.innerHTML = "Jailbreak Failed -- restart your console and retry";
            stopped = true;
            clearInterval(timer);
            return;
        }
        if (pct < 90) {
            pct += 3;
            render();
        }
    }, 400);

    if (window.MutationObserver && document.body) {
        new MutationObserver(function () {
            if (stopped) return;
            var cls = document.body.className;
            if (cls === "done" || cls === "fail") {
                // Let the interval snap the UI on its next tick.
            }
        }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
    }
})();
</script>
<script type="module">
  import "./jb.js?v=10";
</script>
</body>
</html>

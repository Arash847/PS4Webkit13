<!DOCTYPE html>
<html manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 WebKit Jailbreak</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
    <img class="logo" src="logo.png" alt="GoldHEN">
    <div class="eyebrow">PS Torghabeh</div>
    <h1 class="title">PS4 WebKit Jailbreak</h1>
    <div class="subtitle">FIRMWARE 13.02 &mdash; 13.52</div>
    <div class="fw-badge" id="fwbadge">GOLDHEN</div>
    <div class="progress-wrap" id="progress-wrap">
        <div class="progress-info">
            <span id="progress-label">Initializing...</span>
            <span id="progress-pct"></span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
    <h1 id="msgs">Detecting firmware...</h1>
</main>
<script>
(function () {
    function $(id) { return document.getElementById(id); }

    function SetProgress(p, label, cls) {
        var f = $("progress-fill");
        var t = $("progress-pct");
        var l = $("progress-label");
        if (f) { f.className = "progress-fill" + (cls ? " " + cls : ""); f.style.width = Math.max(0, Math.min(100, p)) + "%"; }
        if (t) { t.innerHTML = p + "%"; }
        if (l && label) { l.innerHTML = label; }
    }

    function setMsgs(t) { $("msgs").innerHTML = t; }

    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    if (key) {
        $("fwbadge").innerHTML = "FW " + key + " &middot; GOLDHEN";
    }

    var target = "jb.html" + location.search;
    function go() {
        setMsgs("Loading jailbreak...");
        SetProgress(100, "Loading jailbreak...");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        setMsgs(msg);
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real console can never lock it out.
    if (!supported) {
        SetProgress(100, "Error", "error");
        waitForTap('Unsupported Firmware: <span style="color: red;">' + (key || "unknown") + '</span> -- press X or tap to run anyway', go);
        return;
    }

    SetProgress(10, "Checking firmware...");
    setMsgs("Firmware " + key + " supported. Preparing...");

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        SetProgress(100, "Offline -- from cache", "success");
        setMsgs("Offline -- from cache. Loading...");
        go();
    } else if (ac.status === ac.IDLE) {
        SetProgress(100, "Cached", "success");
        setMsgs("Cached. Loading...");
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        SetProgress(100, "Cache installation complete!", "success");
        waitForTap("Cache Installed Successfully &#10004;",
                   function () { location.reload(); });
    } else {
        SetProgress(5, "Checking cache...");
        setMsgs("Checking offline cache...");
        ac.addEventListener("downloading",
            function () {
                setMsgs("Installing Offline Cache...");
                SetProgress(5, "Installing offline cache...");
            }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var pct = Math.round((e.loaded / e.total) * 100);
                setMsgs("Installing Offline Cache: " + pct + "%");
                SetProgress(pct, "Installing offline cache...");
            }
        }, false);
        ac.addEventListener("cached", function () {
            SetProgress(100, "Cache installation complete!", "success");
            waitForTap("Cache Installed Successfully &#10004;", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            SetProgress(100, "Cache installation complete!", "success");
            waitForTap("Cache Installed Successfully &#10004;",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            SetProgress(100, "Cached -- offline ready", "success");
            setMsgs("Cached -- offline ready. Loading...");
            go();
        }, false);
        ac.addEventListener("error", function () {
            SetProgress(100, "Cache installation failed", "error");
            waitForTap("Error Installing Cache! -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            SetProgress(100, "Cache installation failed", "error");
            waitForTap("Cache Obsolete -- press X or tap to run anyway", go);
        }, false);
    }
})();
</script>
</body>
</html>
